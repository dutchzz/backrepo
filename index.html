<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BACK REPO</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4vw;
      background: var(--bg);
      z-index: 10;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    .hero.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .hero__title {
      font-size: clamp(3rem, 18vw, 16rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.9;
      text-align: center;
      text-transform: uppercase;
      user-select: none;
      animation: rise 1s ease forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .content {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="hero" id="intro">
    <h1 class="hero__title">Back Repo</h1>
  </main>

  <section class="content">
    <p>Main content goes here</p>
  </section>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("intro").classList.add("is-hidden");
      }, 2200);
    });
  </script>
</body>
</html>
